overwrite: true
schema: "http://backend:4005"
documents:
  [
    "./src/requetes/*.requests.ts",
    "./src/requetes/queries/*.ts",
    "./src/requetes/mutations/*.ts",
  ]
generates:
  "src/generated/graphql.ts":
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      addTypename: false
